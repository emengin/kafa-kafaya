apply plugin: 'com.android.application'

// Sürüm numarası package.json'dan (Faz 2.6). Kural ve tablo: docs/OPS.md § 3.1.
//   versionCode = ANA*1 000 000 + ARA*10 000 + YAMA*100 + DERLEME
//   DERLEME: etiketsiz yerel derleme 0 · vX.Y.Z-rc.N etiketi N (1–98) · vX.Y.Z etiketi 99
// CI etiketi -PreleaseTag=... ile verir; etiket package.json sürümüyle uyuşmazsa derleme durur.
def appVersionFrom(String pkgVersion, String tag) {
    def v = pkgVersion =~ /^(\d+)\.(\d+)\.(\d+)$/
    if (!v.matches()) {
        throw new GradleException("package.json sürümü X.Y.Z biçiminde olmalı, bulunan: '${pkgVersion}'")
    }
    int major = v.group(1) as int
    int minor = v.group(2) as int
    int patch = v.group(3) as int
    if (major > 2099 || minor > 99 || patch > 99) {
        throw new GradleException("Sürüm sınırı aşıldı (ANA ≤ 2099, ARA ≤ 99, YAMA ≤ 99): ${pkgVersion}")
    }
    int build
    String name
    if (!tag) {
        build = 0
        name = "${pkgVersion}-dev"
    } else {
        def t = tag =~ /^v(\d+\.\d+\.\d+)(?:-rc\.(\d+))?$/
        if (!t.matches()) {
            throw new GradleException("Etiket vX.Y.Z ya da vX.Y.Z-rc.N olmalı, bulunan: '${tag}'")
        }
        if (t.group(1) != pkgVersion) {
            throw new GradleException("Etiket (${tag}) package.json sürümüyle (${pkgVersion}) uyuşmuyor")
        }
        if (t.group(2) != null) {
            build = t.group(2) as int
            if (build < 1 || build > 98) {
                throw new GradleException("rc numarası 1–98 arasında olmalı: ${tag}")
            }
            name = "${pkgVersion}-rc.${build}"
        } else {
            build = 99
            name = pkgVersion
        }
    }
    return [code: major * 1000000 + minor * 10000 + patch * 100 + build, name: name]
}

def appVersion = appVersionFrom(
    new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version as String,
    (project.findProperty('releaseTag') ?: '') as String)

tasks.register('printAppVersion') {
    def code = appVersion.code
    def name = appVersion.name
    doLast { println "versionName=${name} versionCode=${code}" }
}

android {
    namespace = "com.emengin.kafadarlar"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.emengin.kafadarlar"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersion.code
        versionName appVersion.name
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Gözlemlenebilirlik (Faz 2.8): yalnızca Analytics + Crashlytics. Uzaktan ayar ve A/B testi
    // Nakama'da (Faz 5.4, 11.3); başka Firebase ürünü eklenmez. Sürümler BoM'dan.
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation('com.google.firebase:firebase-analytics') {
        // Reklam kimliği (Advertising ID) kütüphanesi hiç pakete girmez (DATA_MAP: reklam kimliği yok).
        exclude group: 'com.google.android.gms', module: 'play-services-ads-identifier'
    }
    implementation 'com.google.firebase:firebase-crashlytics'
}

apply from: 'capacitor.build.gradle'

// Firebase yapılandırması (Faz 2.8). google-services.json depoda YOK (docs/OPS.md § 4): yerelde
// android/app/ altına elle konur, CI'da GOOGLE_SERVICES_JSON_BASE64 sırrından yazılır. Dosya
// yoksa uygulama Firebase'siz derlenir: gözlemlenebilirlik kapalı, rıza ekranı görünmez (ör. fork).
// -PrequireFirebase verilirse (CI sürüm derlemesi) dosya şarttır.
def servicesJSON = file('google-services.json')
if (servicesJSON.exists() && servicesJSON.text.trim()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
} else if (project.hasProperty('requireFirebase')) {
    throw new GradleException("android/app/google-services.json yok; sürüm derlemesi Firebase'siz olmaz (docs/OPS.md § 4).")
} else {
    logger.lifecycle("google-services.json yok: Firebase'siz derleniyor (gözlemlenebilirlik kapalı).")
}
