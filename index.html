<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1340" />
    <meta name="description" content="Kafa Kafaya — tarayıcıda oynanan 2D, 1v1 kafa topu oyunu." />
    <meta name="mobile-web-app-capable" content="yes" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23fff' stroke='%23111' stroke-width='4'/%3E%3Cpolygon points='32,20 43,28 39,41 25,41 21,28' fill='%23111'/%3E%3C/svg%3E"
    />
    <title>Kafa Kafaya</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* Tam ekran düğmesi (metin/etiket i18n'den; desteklenmiyorsa gizli). */
      #fullscreen {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        right: max(8px, env(safe-area-inset-right));
        z-index: 10;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 2px solid rgba(255, 255, 255, 0.55);
        border-radius: 12px;
        background: rgba(11, 19, 64, 0.55);
        color: #fff;
        cursor: pointer;
        opacity: 0.75;
      }
      #fullscreen:hover,
      #fullscreen:focus-visible {
        opacity: 1;
        outline: none;
        border-color: #ffd23f;
      }
      #fullscreen[hidden] {
        display: none;
      }
      #fullscreen svg {
        width: 24px;
        height: 24px;
      }
      #fullscreen .exit,
      #fullscreen.active .enter {
        display: none;
      }
      #fullscreen.active .exit {
        display: inline;
      }
      /* Dikey ekran uyarısı: yalnızca dokunmatik cihazda ve dikey yönde. */
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: radial-gradient(circle at 50% 40%, #24357f, #070b26);
        color: #fff;
        font-family: 'Arial Black', 'Segoe UI', Arial, sans-serif;
        font-size: 22px;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #rotate svg {
        width: 96px;
        height: 96px;
        animation: rotate-hint 2.2s ease-in-out infinite;
      }
      @keyframes rotate-hint {
        0%,
        20% {
          transform: rotate(0deg);
        }
        55%,
        80% {
          transform: rotate(-90deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }
      @media (orientation: portrait) {
        .is-touch #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <button id="fullscreen" type="button" hidden>
      <svg
        class="enter"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
      >
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
      </svg>
      <svg
        class="exit"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
      >
        <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" />
      </svg>
    </button>
    <div id="rotate" role="alert">
      <svg
        viewBox="0 0 64 64"
        fill="none"
        stroke="#ffd23f"
        stroke-width="4"
        stroke-linejoin="round"
      >
        <rect x="18" y="6" width="28" height="52" rx="6" />
        <circle cx="32" cy="50" r="2.5" fill="#ffd23f" stroke="none" />
      </svg>
      <p id="rotate-text"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
