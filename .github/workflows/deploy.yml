name: CI ve GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek bir Pages yayını; süren yayın iptal edilmez.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Lint + Test + Build + Duman testi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Mobil (Capacitor) derlemesi ayrı klasöre (dist-mobile/); yalnızca duman testi için,
      # Pages'e yüklenmez. Android APK derlemesi Faz 2.6'da.
      - run: npm run build:mobile

      - name: Playwright tarayıcısı
        run: npx playwright install --with-deps chromium

      - name: Duman testi (Playwright)
        run: npm run test:e2e

      - name: Pages yapılandırması
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Pages artefaktını yükle
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: GitHub Pages'e yayınla
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
