name: Android imzalı AAB

# Sürüm etiketi itildiğinde imzalı Android App Bundle (AAB) üretir (Faz 2.6).
#   vX.Y.Z       → sürüm (ayrıca release.yml GitHub Release oluşturur)
#   vX.Y.Z-rc.N  → aday / deneme (yalnızca AAB)
# Etiket kuralı, sürüm numarası ve sırlar: docs/OPS.md § 2–3.
#
# Güvenlik (depo herkese açık):
# - Yalnızca etiket push'unda çalışır; pull_request / pull_request_target tetikleyicisi YOK. Fork'tan
#   gelen PR'lar etiket itemez, GitHub fork PR'larına sır da vermez.
# - Sırlar depo sırrı değil, `android-release` ortamının (environment) sırrıdır; ortam yalnızca `v*`
#   etiketlerine izin verecek şekilde ayarlanır. Başka bir dal ya da iş akışı bu sırları okuyamaz.
# - `build` işinde gerçek sır yok: npm paketleri ve Gradle eklentileri burada çalışır. Tek istisna
#   google-services.json (Faz 2.8): gizli değil (AAB'den okunabilir), yalnızca depoda açıkça durmasın
#   diye depo sırrında.
# - `sign` işi npm / Gradle çalıştırmaz; yalnızca JDK'nın jarsigner'ı ile imzalar. Sırlar yalnızca
#   ilgili adıma `env:` ile verilir (betik metnine `${{ secrets.* }}` yazılmaz, komut satırına şifre
#   konmaz); GitHub sır değerlerini loglarda `***` ile gizler.
# - Bu dosyadaki eylemler commit SHA'sına sabitlenmiştir; önbellek kullanılmaz.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: İmzasız AAB derle (sır yok)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test

      # Mobil web derlemesi + Android projesine kopyalama (cap sync).
      - run: npm run cap:sync

      # Faz 2.8: Firebase yapılandırması depoda yok (docs/OPS.md § 4); depo sırrından yazılır.
      # Bu dosya gerçek bir sır değildir (değerleri AAB'nin içinden zaten okunabilir), bu yüzden
      # sırsız "build" işine verilen tek değer budur; imza anahtarı yine yalnızca "sign" işinde.
      - name: google-services.json (sırdan)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 depo sırrı yok; sürüm Firebase'siz (çökme raporu olmadan) derlenmez (docs/OPS.md § 4)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d -i > android/app/google-services.json
          grep -q '"package_name": *"com.emengin.kafakafaya"' android/app/google-services.json ||
            { echo "::error::google-services.json bu uygulamanın paket adını içermiyor."; exit 1; }

      - name: AAB derle (sürüm package.json'dan, etiket doğrulanır)
        working-directory: android
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./gradlew --no-daemon -q :app:printAppVersion -PreleaseTag="$RELEASE_TAG"
          ./gradlew --no-daemon :app:bundleRelease -PreleaseTag="$RELEASE_TAG" -PrequireFirebase

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aab-imzasiz
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1

  sign:
    name: İmzala
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-release
    env:
      KEY_ALIAS: kafakafaya-upload
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aab-imzasiz
          path: imzasiz

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Sırlar tanımlı mı
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::android-release ortamında ANDROID_KEYSTORE_BASE64 ve ANDROID_KEYSTORE_PASSWORD sırları gerekli (docs/OPS.md § 2.3)."
            exit 1
          fi

      - name: AAB'yi imzala
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d -i > "$ks"
          out="kafadarlar-${RELEASE_TAG}.aab"
          cp imzasiz/app-release.aab "$out"
          jarsigner -keystore "$ks" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 "$out" "$KEY_ALIAS"
          echo "AAB_FILE=$out" >> "$GITHUB_ENV"

      # İmzasız dosyada da `jarsigner -verify` 0 döner; bu yüzden çıktı metni kontrol edilir.
      # Sertifika parmak izi gizli değildir; Play Console'daki yükleme anahtarıyla karşılaştırmak için.
      - name: İmzayı doğrula
        run: |
          jarsigner -verify "$AAB_FILE" | tee verify.txt
          grep -q '^jar verified\.' verify.txt
          keytool -printcert -jarfile "$AAB_FILE" | grep -E 'Owner:|SHA256:'
          {
            echo "### İmzalı AAB: \`$AAB_FILE\`"
            echo
            echo "Yükleme anahtarı sertifikası:"
            echo '```'
            keytool -printcert -jarfile "$AAB_FILE" | grep -E 'Owner:|SHA256:'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kafadarlar-${{ github.ref_name }}-aab
          path: ${{ env.AAB_FILE }}
          if-no-files-found: error
          retention-days: 30
